apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: simpleapps.cloud.leo.io

spec:
  group: cloud.leo.io

  scope: Namespaced

  names:
    plural: simpleapps
    singular: simpleapp
    kind: SimpleApp
    shortNames:
      - sapp

  versions:
    - name: v1alpha1
      served: true
      storage: true

      subresources:
        status: {}

      schema:
        openAPIV3Schema:
          type: object

          properties:
            spec:
              type: object

              properties:
                replicas:
                  type: integer
                  format: int32
                  minimum: 1

                image:
                  type: string

              required:
                - replicas
                - image

            status:
              type: object
              properties:
                readyReplicas:
                  type: integer
                  format: int32
                observedGeneration:
                  type: integer
                  format: int64



